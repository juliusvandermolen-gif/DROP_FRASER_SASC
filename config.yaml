projectTitle: DROP 8 sample run
htmlOutputPath: /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Output_8_samples/html
indexWithFolderName: true
root: /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Output_8_samples  #Path of folder where output with processed_data, processed_results and html(check htmlOutputPath) will be
sampleAnnotation: /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Annotation_8_samples.tsv
geneAnnotation:
  GRCh38_104: /exports/sascstudent/jmvandermolen1/107432-004/Homo_sapiens.GRCh38.104.gtf  #GTF file.
genomeAssembly: hg38
genome: #Path genome fasta files.
  ncbi: /exports/sascstudent/jmvandermolen1/107432-004/Homo_sapiens.GRCh38.dna.primary_assembly.fa #Reference genome used for alignment RNA-seq run
hpoFile: null
random_seed: true
exportCounts:
  geneAnnotations:
  - GRCh38_104
  excludeGroups:
  - mae
  - outrider_external
  - fraser_external
aberrantExpression:
  run: false
  groups:
  - outrider
  - outrider_external
  fpkmCutoff: 1
  implementation: autoencoder
  padjCutoff: 1
  zScoreCutoff: 0
  genesToTest: Data/genes_to_test.yaml
  maxTestedDimensionProportion: 3
  yieldSize: 2000000
  useOHTtoObtainQ: true
aberrantSplicing:
  run: true   # Run FRASER on the data. Check to discard on other modules.
  groups:     # Include external group with public count data. Probably discard external group because of overlap junction problem.
  - Lymphocyte_NMD
  - Lymphocyte_NMD_inhibit
  recount: true #recounts BAM files even if there are already count files.
  longRead: false #Set to true only if counting Nanopore or PacBio long reads.
  keepNonStandardChrs: false
  filter: true  #Filters introns/junctions
  minExpressionInOneSample: 20 #Minimal reads for intron in at least one sample over cohort to be kept for analysis.
  quantileMinExpression: 10 #Minimal abundance reads for specific quantile from quantileForFiltering to be kept for analysis. For example, if quantileForFiltering=0.95, then the top 5% of introns/junctions with the highest abundance will be kept for analysis.
  minDeltaPsi: 0.0  #Minimal variation of junction event compared to other events.
  implementation: PCA-BB-Decoder
  padjCutoff: 0.1
  maxTestedDimensionProportion: 6 #Maximal number of tested dimensions for FRASER.
  genesToTest: null
  useOHTtoObtainQ: false
  FRASER_version: FRASER2
  deltaPsiCutoff: 0.1 #Minimal deltaPsi for an intron to be considered aberrant. 
  quantileForFiltering: 0.95  #Quatile for filtering top. 0,95=5% > quantileMinExpression.
mae:
  run: false
  groups:
  - mae
  gatkIgnoreHeaderCheck: true
  padjCutoff: 0.5
  allelicRatioCutoff: 0.7
  addAF: false
  maxAF: 0.001
  maxVarFreqCohort: 1
  qcVcf: /exports/sascstudent/jmvandermolen1/drop_demo_fraser2/Data/qc_vcf_1000G.vcf.gz
  qcGroups:
  - mae
  dnaRnaMatchCutoff: 0.85
rnaVariantCalling:
  run: false
  groups:
  - batch_0
  - batch_1
  highQualityVCFs:
  - /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Data/high_confidence_snps.vcf.gz
  - /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Data/high_confidence_indels.vcf.gz
  dbSNP: /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Data/dbSNP_chr21.vcf.gz
  repeat_mask: /exports/sascstudent/jmvandermolen1/Developer/drop_demo_fraser2/Data/repeat_mask_chr21.bed
  createSingleVCF: true
  addAF: false
  maxAF: 0.001
  maxVarFreqCohort: 1
  hcArgs: null
  minAlt: 3
  yieldSize: 100000
tools:
  gatkCmd: gatk
  bcftoolsCmd: bcftools
  samtoolsCmd: samtools
